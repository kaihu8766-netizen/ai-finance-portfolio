<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b16}
  .stage{position:relative;width:1600px;height:1000px;overflow:hidden;
    background:
      radial-gradient(1200px 700px at 22% -12%, rgba(56,189,248,.20), transparent 60%),
      radial-gradient(1000px 700px at 92% 0%, rgba(167,139,250,.16), transparent 62%),
      radial-gradient(1200px 800px at 50% 120%, rgba(30,41,59,.65), transparent 60%),
      linear-gradient(160deg,#0a1226 0%, #070b16 55%, #05080f 100%);
  }
  .stage::before{content:'';position:absolute;inset:-10%;pointer-events:none;
    background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);
    background-size:52px 52px;transform:perspective(900px) rotateX(56deg) translateY(120px) scale(1.35);opacity:.55;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 60%,transparent)}
  .glow{position:absolute;left:50%;top:46%;width:1180px;height:620px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(closest-side, rgba(56,189,248,.16), rgba(167,139,250,.07), transparent 72%);filter:blur(18px)}
  .device{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:1200px}
  .lid{position:relative;width:1200px;height:675px;border-radius:20px;padding:14px;background:linear-gradient(160deg,#1b2436,#0c1220);
    box-shadow:0 40px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(148,163,184,.18), inset 0 1px 0 rgba(255,255,255,.06)}
  .lid::after{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,.10) 0%, transparent 22%, transparent 78%, rgba(56,189,248,.08) 100%)}
  .screen{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#0B132B;box-shadow:inset 0 0 0 1px rgba(148,163,184,.18)}
  .screen img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.02)}
  .screen::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.06), transparent 18%),
      radial-gradient(120% 60% at 50% 0%, rgba(56,189,248,.06), transparent 55%);
    mix-blend-mode:screen}
  .camera{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#1a2433;box-shadow:0 0 6px rgba(56,189,248,.5)}
  .base{position:relative;width:1300px;height:26px;margin:-2px auto 0;border-radius:0 0 26px 26px;
    background:linear-gradient(180deg,#232d42,#0b1120 60%,#070b14);box-shadow:0 22px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
  .base::before{content:'';position:absolute;left:50%;top:3px;transform:translateX(-50%);width:150px;height:9px;border-radius:0 0 10px 10px;background:#0a0f1b;box-shadow:inset 0 -3px 6px rgba(0,0,0,.6)}
  .base::after{content:'';position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:900px;height:52px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent 70%);filter:blur(8px)}
  .badge{position:absolute;left:70px;top:76px;display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-radius:14px;background:rgba(15,27,51,.72);border:1px solid rgba(56,189,248,.28);backdrop-filter:blur(8px);
    box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .badge .m{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#38BDF8,#A78BFA);display:flex;align-items:center;justify-content:center;font-weight:800;color:#06101f;font-size:14px}
  .badge b{display:block;font-size:15px;color:#f1f5f9;font-family:"Inter","Segoe UI",sans-serif;letter-spacing:.2px}
  .badge span{display:block;font-size:11px;color:#93a4bd;letter-spacing:.8px;font-family:"Inter","Segoe UI",sans-serif}
  .feats{position:absolute;right:62px;top:92px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .feat{font-family:"Inter","Segoe UI",sans-serif;font-size:12.5px;color:#cbd5e1;padding:8px 12px;border-radius:10px;background:rgba(15,27,51,.66);border:1px solid rgba(148,163,184,.22);backdrop-filter:blur(6px)}
  .feat b{color:#67e8f9;font-weight:600}
  .cap{position:absolute;left:0;right:0;bottom:58px;text-align:center;font-family:"Inter","Segoe UI",sans-serif}
  .cap h2{font-size:22px;color:#e2e8f0;font-weight:600;letter-spacing:.5px;margin:0 0 6px}
  .cap p{margin:0;font-size:12.5px;color:#8296b0;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="badge"><div class="m">T</div><div><b>AI Treasury Copilot</b><span>AI DEBT &amp; ACCRUAL · 2026</span></div></div>
  <div class="feats">
    <div class="feat"><b>Actual/360</b> 银行级逐日计提</div>
    <div class="feat"><b>✦ AI</b> 合同一键解析 · 自动回填</div>
    <div class="feat"><b>✦ AI</b> 司库洞察报告 · 流式生成</div>
  </div>
  <div class="device">
    <div class="lid">
      <div class="camera"></div>
      <div class="screen"><img src="../../out/review/treasury/overview2.jpg" alt="AI 集团贷款还本付息与利息计提系统界面"></div>
    </div>
    <div class="base"></div>
  </div>
  <div class="cap">
    <h2>AI 集团贷款还本付息动态排程与利息计提系统</h2>
    <p>Bank-grade computation · Large-model interaction · Single-file web app</p>
  </div>
</div>
</body>
</html>
