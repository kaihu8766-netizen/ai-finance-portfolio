name: Review gate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # 校验PR头提交，而非GitHub的合并结果
          fetch-depth: 0  # 需要完整历史算merge-base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest pyyaml

      - name: Run gate regression tests
        run: python -m pytest tests/ -v
        # F-20260924-03：回归测试前置，失败即阻断后续 gate（fail fast，防 gate 改坏自己）

      - name: Run preflight checks
        run: python tools/preflight.py

      - name: Verify review stamp
        run: python tools/check_review_stamp.py

      - name: Time anchor (GitHub platform time)
        run: python tools/audit_time_anchor.py --commit ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # F-20260924-03 B-3：CI 有 token → 真实校验；无 token/网络不可达 → SKIP 不阻断
        continue-on-error: true
