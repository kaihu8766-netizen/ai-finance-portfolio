name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp echarts.min.js _site/
          cp -r demo _site/
          cp -r assets _site/
          [ -f favicon.ico ] && cp favicon.ico _site/ || true
          [ -f favicon.png ] && cp favicon.png _site/ || true
          touch _site/.nojekyll
          echo "Pages artifact:"; find _site -type f | head -30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${PAGES_ARTIFACT_NAME}" --jq '[.artifacts[] | select(.expired == false)] | length')"; then
              if [ "$count" = "1" ]; then
                echo "Pages artifact metadata ready: ${PAGES_ARTIFACT_NAME}"
                exit 0
              fi
            fi
            echo "Waiting for Pages artifact metadata (${attempt}/12)"
            sleep 5
          done
          echo "Pages artifact metadata did not become visible" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
